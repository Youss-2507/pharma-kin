name: pharma_kin
description: Application de recherche de médicaments dans les pharmacies de Kinshasa
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # Localisation & cartes
  geolocator: ^13.0.1
  url_launcher: ^6.3.1

  # Photo & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Stockage local (hors-ligne)
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
