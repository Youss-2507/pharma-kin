name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Générer le projet Android natif si absent
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.pharmakin --project-name pharma_kin .
          fi

      - name: Copier la configuration Firebase
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          else
            echo "AVERTISSEMENT: firebase/google-services.json introuvable"
          fi

      - name: Activer le plugin Google Services (Gradle)
        run: |
          SETTINGS_GRADLE="android/settings.gradle.kts"
          APP_GRADLE="android/app/build.gradle.kts"
          if [ -f "$SETTINGS_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$SETTINGS_GRADLE"; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' "$APP_GRADLE"
          fi

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Compiler l'APK (mode release)
        run: flutter build apk --release

      - name: Publier l'APK comme résultat téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: pharma-kin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
