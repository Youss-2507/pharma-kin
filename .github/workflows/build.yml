name: Build APK

# Se déclenche à chaque envoi de code sur la branche main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Le dossier android/ n'est pas versionné (il est régénéré à chaque
      # build) : ça évite d'avoir à le maintenir à la main depuis le téléphone.
      - name: Générer le projet Android natif si absent
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.pharmakin .
          fi

      # Le fichier google-services.json (téléchargé depuis la console
      # Firebase) doit être présent dans firebase/google-services.json
      # à la racine du dépôt. On le copie au bon endroit avant de builder.
      - name: Copier la configuration Firebase
        run: |
          if [ -f "firebase/google-services.json" ]; then
            cp firebase/google-services.json android/app/google-services.json
          else
            echo "AVERTISSEMENT: firebase/google-services.json introuvable - l'app compilera mais Firebase ne fonctionnera pas encore."
          fi

      - name: Activer le plugin Google Services (Gradle)
        run: |
          BUILD_GRADLE="android/build.gradle.kts"
          APP_GRADLE="android/app/build.gradle.kts"
          if [ -f "$BUILD_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$BUILD_GRADLE"; then
            sed -i '/dependencies {/a\        classpath("com.google.gms:google-services:4.4.2")' "$BUILD_GRADLE"
          fi
          if [ -f "$APP_GRADLE" ] && ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
            echo 'apply(plugin = "com.google.gms.google-services")' >> "$APP_GRADLE"
          fi

      - name: Installer les dépendances Flutter
        run: flutter pub get

      - name: Compiler l'APK (mode release)
        run: flutter build apk --release

      - name: Publier l'APK comme résultat téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: pharma-kin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
